<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign-in page — mockup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="frame" lang="fr">
    <div class="frame-label">Display language fr, page opened</div>
    <header class="site-header">
      <h1><a href="home-page.html">Prêt d'outils</a></h1>
    </header>
    <main>
      <h2>Connexion</h2>
      <form class="stacked-form panel">
        <label>Identifiant <input type="text" name="login"></label>
        <label>Mot de passe <input type="password" name="password"></label>
        <button class="primary">Se connecter</button>
      </form>
    </main>
  </section>

  <section class="frame" lang="en">
    <div class="frame-label">Display language en, sign-in failed</div>
    <header class="site-header">
      <h1><a href="home-page.html">Tool Lending</a></h1>
    </header>
    <main>
      <h2>Sign in</h2>
      <p class="message error">Wrong login or password, or too many
      attempts: wait a few minutes and try again.</p>
      <form class="stacked-form panel">
        <label>Login <input type="text" name="login"></label>
        <label>Password <input type="password" name="password"></label>
        <button class="primary">Sign in</button>
      </form>
    </main>
  </section>
</body>
</html>
